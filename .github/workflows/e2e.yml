name: Browser E2E

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install workspace dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build packages
        run: npm run build

      - name: Install Playwright and resolve browser
        id: browser
        shell: bash
        run: |
          npm install --no-save playwright@1.52.0
          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$chrome_bin" ]; then
            echo "Found system browser: $chrome_bin"
            echo "chrome_path=$chrome_bin" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run Browser E2E
        env:
          CHROME_PATH: ${{ env.chrome_path }}
        run: node --import ./packages/demo/e2e/register-esm.mjs packages/demo/e2e/browser-e2e.mjs
