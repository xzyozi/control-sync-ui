name: Generate package-lock.json

# ローカルに Node がない環境で、package-lock.json を生成するための手動実行用ワークフロー。
# 実行後、成果物（artifact）の package-lock.json を、リポジトリのルートにコミットする。
# ロックファイルをコミットしたら、このワークフローは削除してよい。
# （docs/setup/CSU-ENV-001 §6 の例外 EX-002 の解除手順）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # サプライチェーン対策（CSU-ENV-001 §4.6）: 公開から3日以内の版を固定しない。
      # ローカルの `min-release-age=3` と同じ趣旨で、`--before` で3日前の時点の版に限る。
      - name: Generate lock file only
        shell: bash
        run: |
          before="$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          echo "Resolving versions published before: ${before}"
          npm install --package-lock-only --ignore-scripts --before="${before}"

      - name: Upload package-lock.json
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
